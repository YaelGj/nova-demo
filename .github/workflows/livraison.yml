name: livraison
on: {push: {tags: ["v*"]}}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: >-
          gh release create
          "$GITHUB_REF_NAME" -F CHANGELOG.md
