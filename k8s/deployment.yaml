# Trois copies de l'API Nova, maintenues en vie par le Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nova
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nova
  template:
    metadata:
      labels:
        app: nova
    spec:
      containers:
        - name: api
          image: nova:1.0
          # Image chargée dans le cluster par « kind load docker-image » : pas de registre.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
